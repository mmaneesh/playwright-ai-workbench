services:
  tests:
    build: .
    init: true
    shm_size: '1gb'
    environment:
      UI_BASE_URL: ${UI_BASE_URL:-https://www.saucedemo.com}
      API_BASE_URL: ${API_BASE_URL:-https://billpay-api.gauravkhurana-practice-api.workers.dev}
      CI: 'true'
    volumes:
      - ./playwright-report:/workbench/playwright-report
      - ./test-results:/workbench/test-results

  visual-tests:
    build: .
    # Pinned to match CI's amd64 runners (.github/workflows/playwright.yml) so baselines
    # generated locally on an Apple Silicon Mac render identically in CI, not just "close".
    platform: linux/amd64
    init: true
    shm_size: '1gb'
    environment:
      UI_BASE_URL: ${UI_BASE_URL:-https://www.saucedemo.com}
      CI: 'true'
    volumes:
      - ./tests/visual:/workbench/tests/visual
      - ./playwright-report:/workbench/playwright-report
      - ./test-results:/workbench/test-results
    command: ['npm', 'run', 'test:visual']
